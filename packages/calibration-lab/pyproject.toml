[project]
name = "calibration-lab"
version = "0.1.0"
description = "Calibration talk lab: disaster-tweet classification, recalibration, conformal, and the labeling loop."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "lightgbm>=4.3",
]

[project.optional-dependencies]
gemma = ["sentence-transformers>=5.1", "transformers>=4.56", "torch>=2.4"]
tabpfn = ["tabpfn>=2.0"]
jev = ["httpx>=0.27"]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
